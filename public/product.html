<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>المنتج — Fettra _ فِطْره 🎀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<header class="site-header" id="site-header"></header>

<main class="container" id="pdContainer">
  <div class="pd-layout">
    <div class="skeleton" style="aspect-ratio:1/1"></div>
    <div>
      <div class="skeleton" style="height:32px;width:70%;margin-bottom:14px;"></div>
      <div class="skeleton" style="height:24px;width:40%;margin-bottom:20px;"></div>
      <div class="skeleton" style="height:100px;"></div>
    </div>
  </div>
</main>

<section class="reviews-section container" id="reviewsSection">
  <div class="section-title">
    <h2>آراء عميلاتنا</h2>
  </div>
  <div class="reviews-grid" id="reviewsList">
    <div class="skeleton" style="height:140px;"></div>
    <div class="skeleton" style="height:140px;"></div>
    <div class="skeleton" style="height:140px;"></div>
  </div>
  <div class="review-form-card" id="reviewFormWrap"></div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script src="/js/api.js"></script>
<script src="/js/common.js"></script>
<script src="/js/product.js"></script>
<script src="/js/reviews.js"></script>
</body>
</html>
