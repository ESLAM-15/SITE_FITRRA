<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>تسجيل الدخول — Fettra _ فِطْره 🎀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<header class="site-header" id="site-header"></header>

<main class="container">
  <div class="form-card">
    <h1>أهلاً بعودتك</h1>
    <p class="sub">سجّل الدخول للتسوق ومتابعة طلباتك.</p>
    <div class="form-error" id="formError"></div>

    <div id="googleSignInBtn" style="display:flex;justify-content:center;margin-bottom:16px;"></div>
    <div class="divider" style="display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--color-muted);font-size:13px;">
      <span style="flex:1;height:1px;background:var(--color-border);"></span>
      أو سجّل الدخول بالبريد الإلكتروني
      <span style="flex:1;height:1px;background:var(--color-border);"></span>
    </div>

    <form id="loginForm" novalidate>
      <div class="field" id="f-email">
        <label>البريد الإلكتروني</label>
        <input type="email" name="email" required maxlength="150" />
        <small class="error"></small>
      </div>
      <div class="field" id="f-password">
        <label>كلمة المرور</label>
        <input type="password" name="password" required maxlength="200" />
        <small class="error"></small>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">تسجيل الدخول</button>
    </form>
    <div class="form-footer-link">ليس لديك حساب؟ <a href="/register.html">أنشئ حسابًا</a></div>
  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="/js/api.js"></script>
<script src="/js/common.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
