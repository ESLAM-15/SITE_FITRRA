<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>لوحة القيادة — إدارة Fettra _ فِطْره 🎀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body>
<div class="admin-shell" id="adminShell">
  <aside class="sidebar">
    <div class="brand">Fettra<span> _ فِطْره 🎀</span></div>
    <nav class="sidebar-nav"></nav>
    <div class="sidebar-user" style="padding:0 20px;font-size:12px;color:#a9c2b3;margin-top:10px;"></div>
    <button class="logout-btn" onclick="adminLogout()">تسجيل الخروج</button>
  </aside>
  <main class="admin-main">
    <div class="admin-topbar">
      <h1>لوحة القيادة</h1>
    </div>
    <div class="stat-grid" id="statGrid">
      <div class="stat-card"><div class="label">المنتجات</div><div class="value" id="statProducts">—</div></div>
      <div class="stat-card"><div class="label">الطلبات</div><div class="value" id="statOrders">—</div></div>
      <div class="stat-card"><div class="label">طلبات قيد الانتظار</div><div class="value" id="statPending">—</div></div>
      <div class="stat-card"><div class="label">الإيرادات (المدفوعة)</div><div class="value" id="statRevenue">—</div></div>
    </div>
    <div class="card">
      <h2 style="margin-top:0;font-size:16px;">أحدث الطلبات</h2>
      <div style="overflow-x:auto;">
        <table>
          <thead><tr><th>الطلب</th><th>العميل</th><th>الإجمالي</th><th>الحالة</th><th>الدفع</th><th>التاريخ</th></tr></thead>
          <tbody id="recentOrdersBody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="/admin/js/adminApi.js"></script>
<script src="/admin/js/adminDashboard.js"></script>
</body>
</html>
