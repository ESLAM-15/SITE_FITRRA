<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>الطلبات — إدارة Fettra _ فِطْره 🎀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body>
<div class="admin-shell" id="adminShell">
  <aside class="sidebar">
    <div class="brand">Fettra<span> _ فِطْره 🎀</span></div>
    <nav class="sidebar-nav"></nav>
    <div class="sidebar-user" style="padding:0 20px;font-size:12px;color:#a9c2b3;margin-top:10px;"></div>
    <button class="logout-btn" onclick="adminLogout()">تسجيل الخروج</button>
  </aside>
  <main class="admin-main">
    <div class="admin-topbar"><h1>الطلبات</h1></div>

    <div class="toolbar">
      <select id="statusFilter" style="padding:10px 14px;border-radius:9px;border:1.5px solid var(--color-border);">
        <option value="">كل الحالات</option>
        <option value="pending">قيد الانتظار</option>
        <option value="processing">قيد التجهيز</option>
        <option value="shipped">تم الشحن</option>
        <option value="delivered">تم التوصيل</option>
        <option value="cancelled">ملغي</option>
      </select>
    </div>

    <div class="card">
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr><th>الطلب</th><th>العميل</th><th>العنوان</th><th>الأصناف</th><th>الإجمالي</th><th>الدفع</th><th>الحالة</th><th>التاريخ</th></tr>
          </thead>
          <tbody id="ordersBody"></tbody>
        </table>
      </div>
      <div id="ordersEmpty" class="empty-state" style="display:none;">
        <div class="icon">📦</div><p>لا توجد طلبات.</p>
      </div>
    </div>
  </main>
</div>

<script src="/admin/js/adminApi.js"></script>
<script src="/admin/js/adminOrders.js"></script>
</body>
</html>
